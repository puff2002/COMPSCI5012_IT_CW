<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCloset | OOTD</title>
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="app-sidebar-header">
        <h1 class="brand-title">SmartCloset</h1>
        <p class="brand-subtitle">Wardrobe Control Center</p>
      </div>
      <nav class="app-nav" aria-label="Main">
        <a class="app-nav-link" href="./dashboard.html">Dashboard</a>
        <a class="app-nav-link" href="./closet.html">My Closet</a>
        <a class="app-nav-link" href="./ootd.html">OOTD Generator</a>
        <a class="app-nav-link" href="./history.html">History</a>
        <a class="app-nav-link" href="./settings.html">Settings</a>
      </nav>
    </aside>
    <main class="app-main" id="main-content">
      <header class="page-header">
        <h2>OOTD Generator</h2>
      </header>
      <section class="panel">
        <h3>Location</h3>
        <form id="locationForm" class="form-row">
          <div class="form-field">
            <p class="status-line">Use your browser's current GPS location to fetch live weather.</p>
          </div>
          <div class="form-field form-submit-field">
            <button id="recommendBtn" class="btn btn-primary" type="submit">Generate OOTD</button>
          </div>
        </form>
        <p id="ootdStatus" class="status-line" aria-live="polite"></p>
        <p id="weatherText" class="status-line"></p>
      </section>

      <section class="panel">
        <h3>Recommendation</h3>
        <p id="recommendText" class="status-line"></p>
        <ul id="outfitItems" class="outfit-items recommendation-list"></ul>
      </section>
    </main>
  </div>
  <script type="module" src="./assets/js/pages/ootd.js"></script>
</body>
</html>
