<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCloset | Closet</title>
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="app-sidebar-header">
        <h1 class="brand-title">SmartCloset</h1>
        <p class="brand-subtitle">Wardrobe Control Center</p>
      </div>
      <nav class="app-nav" aria-label="Main">
        <a class="app-nav-link" href="./dashboard.html">Dashboard</a>
        <a class="app-nav-link" href="./closet.html">My Closet</a>
        <a class="app-nav-link" href="./ootd.html">OOTD Generator</a>
        <a class="app-nav-link" href="./history.html">History</a>
        <a class="app-nav-link" href="./settings.html">Settings</a>
      </nav>
    </aside>
    <main class="app-main" id="main-content">
      <header class="page-header">
        <h2>My Closet</h2>
        <button id="toggleComposerBtn" class="btn btn-primary" type="button" aria-expanded="false" aria-controls="closetComposer">
          Add Item
        </button>
      </header>

      <section class="panel">
        <div class="section-header">
          <h3>Closet Items</h3>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="filterText">Search</label>
            <input id="filterText" class="input" placeholder="Search name or description">
          </div>
          <div class="form-field">
            <label for="filterCategory">Filter category</label>
            <select id="filterCategory" class="select">
              <option value="">All</option>
              <option value="top">Top</option>
              <option value="bottom">Bottom</option>
              <option value="shoes">Shoes</option>
            </select>
          </div>
        </div>
        <p id="closetStatus" class="status-line" aria-live="polite"></p>
        <section id="itemsGrid" class="items-grid" aria-label="Closet items"></section>
      </section>

      <section id="closetComposer" class="closet-composer is-hidden" aria-hidden="true">
        <section class="panel">
          <div class="composer-topbar">
            <div>
              <p class="eyebrow">Add clothing</p>
              <h3>Upload and Auto Analyze</h3>
              <p class="muted">Start with an image. The editable clothing details will appear after analysis is complete.</p>
            </div>
          </div>
          <form id="uploadForm" class="composer-upload-form">
            <div class="form-row">
              <div class="form-field">
                <label for="itemImage">Image</label>
                <input id="itemImage" class="input" type="file" accept="image/*" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label>
                  <input id="removeBackground" type="checkbox">
                  Remove clothing background before analysis
                </label>
              </div>
            </div>
            <p id="uploadStatus" class="status-line" aria-live="polite"></p>
            <div class="item-actions">
              <button id="uploadBtn" class="btn btn-secondary" type="submit">Upload Image</button>
            </div>
          </form>
        </section>

        <section id="itemDetailsCard" class="panel closet-details-card is-hidden" aria-hidden="true">
          <div class="composer-topbar">
            <div>
              <p class="eyebrow">Editable details</p>
              <h3 id="itemFormTitle">Add New Item</h3>
            </div>
          </div>
          <p id="itemImageStatus" class="status-line" aria-live="polite"></p>
          <form id="itemForm" novalidate>
            <div class="form-row">
              <div class="form-field">
                <label for="itemCategory">Category</label>
                <select id="itemCategory" class="select" required>
                  <option value="">Select category</option>
                  <option value="top">Top</option>
                  <option value="bottom">Bottom</option>
                  <option value="shoes">Shoes</option>
                </select>
              </div>
              <div class="form-field">
                <label for="itemName">Item Name</label>
                <input id="itemName" class="input" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label for="itemStyle">Style tags (comma-separated)</label>
                <input id="itemStyle" class="input" placeholder="casual, minimalist">
              </div>
              <div class="form-field">
                <label for="itemSeason">Season tags (comma-separated)</label>
                <input id="itemSeason" class="input" placeholder="summer, spring">
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label for="itemUsage">Usage tags (comma-separated)</label>
                <input id="itemUsage" class="input" placeholder="daily, office">
              </div>
              <div class="form-field">
                <label for="itemColor">Color</label>
                <input id="itemColor" class="input" placeholder="white">
              </div>
            </div>
            <div class="form-field">
              <label for="itemDescription">Description</label>
              <input id="itemDescription" class="input" placeholder="notes">
            </div>
            <p id="itemError" class="status-line status-error" aria-live="polite"></p>
            <div class="item-actions">
              <button id="itemSubmit" class="btn btn-primary" type="submit">Save item</button>
              <button id="itemReset" class="btn btn-secondary" type="button">Reset</button>
            </div>
          </form>
        </section>
      </section>
    </main>
  </div>
  <script type="module" src="./assets/js/pages/closet.js"></script>
</body>
</html>
